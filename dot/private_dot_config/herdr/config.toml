onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[terminal]
default_shell = "zsh"
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[ui]
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
mouse_capture = true

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "tab-smart-rename.rename-now"
description = "smart rename current tab"

[[keys.command]]
key = "prefix+option+t"
type = "plugin_action"
command = "tab-smart-rename.rename-all"
description = "force smart rename all tabs"
